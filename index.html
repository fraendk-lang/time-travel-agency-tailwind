<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Travel Agency</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
<body class="bg-[#f3eadb] font-sans">
<header class="flex flex-wrap justify-between items-center p-5 bg-blue-950 text-white">
        <h1 class="text-3xl font-bold">Time Travel Agency</h1>
        <nav class="flex gap-4">
            <a href="#services">Services</a>
            <a href="#gallery">Gallery</a>
        </nav>
</header>
    <main class="p-6">
        <section id="services" class="mb-8">
           <h2 class="text-2xl font-bold mb-4">Our Services</h2>
            <div class="flex flex-wrap gap-6">
                <article class="bg-white p-5 rounded-xl flex-[1_1_250px]">
                    <h3>Visit the Past</h3>
                    <p>Explore ancient cities and discover history.</p>
                </article>
                <article class="bg-white p-5 rounded-xl flex-[1_1_250px]">
                    <h3>Explore the Future</h3>
                    <p>Discover future cities and new technologies.</p>
                </article>

            </div>
        </section>
        <section id="gallery" class="mb-8">
            <h2 class="text-2xl font-bold mb-4">Travel Gallery</h2>
            <div class="grid grid-cols-1 min-[601px]:grid-cols-3 gap-4">
                <img class="w-full h-auto" src="images/roman-city.png" alt="Ancient Roman city with temples and a stone-paved street">
                <img class="w-full h-auto" src="https://picsum.photos/seed/travel2/600/400" alt="Another travel gallery placeholder">
                <img class="w-full h-auto" src="https://picsum.photos/seed/travel3/600/400" alt="Third travel gallery placeholder">
            </div>
        </section>
    </main>
    <footer class="flex justify-center bg-blue-950 text-white p-5">
        <p>Time Travel Agency — Your next adventure awaits.</p>
    </footer>
</body>

</html>
